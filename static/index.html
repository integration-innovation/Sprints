<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Structured Sprints</title>
    <meta
      name="description"
      content="Run bi-weekly build sprints: each participant sets one sprint-sized target, builds it, and records what became possible."
    />

    <!-- Installable app. Paths are relative so this works at any base path. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#3b63d6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sprints" />
    <link rel="apple-touch-icon" href="./pwa/apple-touch-icon.png" />
    <link rel="icon" href="./pwa/icon-192.png" />

    <link rel="stylesheet" href="./assets/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font: 14px system-ui; margin: 3rem auto; max-width: 30rem; text-align: center">
        Structured Sprints needs JavaScript — it runs entirely in your browser.
      </p>
    </noscript>
    <script src="./assets/app.js"></script>
  </body>
</html>
